name: Docker build and smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag npmplus-tls-sync:test .

      - name: Check container startup
        run: |
          docker run --detach --name npmplus-tls-sync-test \
            --network host \
            --env APP_SECRET=ci-only-secret-0123456789 \
            --env ADMIN_PASSWORD=adminpass1 \
            npmplus-tls-sync:test
          # Allow Uvicorn to finish starting before checking either endpoint.
          curl --fail --silent --show-error --retry 15 --retry-delay 1 \
            --retry-all-errors --retry-max-time 30 --max-time 5 \
            http://127.0.0.1:8080/health
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/login > /dev/null

      - name: Test synchronization against mock NPM servers
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/nmp-sync-venv"
          source "$RUNNER_TEMP/nmp-sync-venv/bin/activate"
          python -m pip install -r requirements.txt
          python -m dev.mock_npm --port 9001 --role master --auth cookie &
          master_pid=$!
          python -m dev.mock_npm --port 9002 --role node --auth bearer &
          node_pid=$!
          trap 'kill "$master_pid" "$node_pid" 2>/dev/null || true' EXIT
          for port in 9001 9002; do
            curl --fail --silent --show-error --retry 15 --retry-delay 1 \
              --retry-connrefused --max-time 5 "http://127.0.0.1:$port/_debug" > /dev/null
          done
          python -m dev.e2e

      - name: Show container logs on failure
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' npmplus-tls-sync-test || true
          docker logs npmplus-tls-sync-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force --volumes npmplus-tls-sync-test || true

      - name: Export tested Docker image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset="npmplus-tls-sync-${RELEASE_TAG}-linux-amd64.tar.gz"
          docker tag npmplus-tls-sync:test "nmp-sync:${RELEASE_TAG}"
          docker save "nmp-sync:${RELEASE_TAG}" | gzip > "$asset"

      - name: Transfer release archive
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: release-image
          path: npmplus-tls-sync-*-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: docker-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-image

      - name: Publish Docker image to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset="npmplus-tls-sync-${RELEASE_TAG}-linux-amd64.tar.gz"
          gh release create "$RELEASE_TAG" "$asset" --verify-tag --generate-notes
