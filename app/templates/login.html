{% extends "base.html" %}
{% block title %}{{ t("Вход") }} — NMP Sync{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>NMP Sync</h1>
  <p class="muted">{{ t("Синхронизация сертификатов между серверами NPMplus") }}</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t("Логин") }}<input name="username" autocomplete="username" required autofocus></label>
    <label>{{ t("Пароль") }}<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">{{ t("Войти") }}</button>
  </form>
</div>
{% endblock %}
