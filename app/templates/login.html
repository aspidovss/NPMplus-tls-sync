{% extends "base.html" %}
{% block title %}Вход — NMP Sync{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>NMP Sync</h1>
  <p class="muted">Синхронизация сертификатов между серверами NPMplus</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Логин<input name="username" autocomplete="username" required autofocus></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Войти</button>
  </form>
</div>
{% endblock %}
