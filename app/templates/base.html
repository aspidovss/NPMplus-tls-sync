<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NMP Sync{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
{% if running and path == '/' %}<meta http-equiv="refresh" content="5">{% endif %}
</head>
<body>
{% if user %}
<header class="top">
  <div class="brand">NMP&nbsp;Sync</div>
  <nav>
    <a href="/" class="{{ 'active' if path == '/' }}">{{ t("Обзор") }}</a>
    <a href="/servers" class="{{ 'active' if path.startswith('/servers') }}">{{ t("Серверы") }}</a>
    <a href="/certs" class="{{ 'active' if path == '/certs' }}">{{ t("Сертификаты") }}</a>
    <a href="/logs" class="{{ 'active' if path == '/logs' }}">{{ t("Журнал") }}</a>
    <a href="/settings" class="{{ 'active' if path == '/settings' }}">{{ t("Настройки") }}</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link">{{ t("Выйти") }} ({{ user }})</button>
  </form>
</header>
{% endif %}
<main>
  {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<footer>NMP Sync {{ version }}</footer>
</body>
</html>
